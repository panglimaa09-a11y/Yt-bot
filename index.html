<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>AutoSubs — Debug Mode</title>
  
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    .page { display: none; }
    .page.active { display: flex; }
    .appview { display: none; }
    .appview.active { display: block; }
  </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen font-sans">

<!-- HALAMAN LOGIN/DAFTAR -->
<section id="auth" class="page active min-h-screen items-center justify-center p-5">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
    <div class="text-center mb-6">
      <h2 id="auth-title" class="text-2xl font-extrabold text-white">Login / Debug</h2>
      <p class="text-xs text-slate-400 mt-1">Uji Coba Koneksi Supabase</p>
    </div>

    <form onsubmit="handleAuth(event)" class="space-y-4">
      <div>
        <label class="text-xs text-slate-300">Email Akun</label>
        <input id="auth-email" type="email" required class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm outline-none focus:border-red-500" placeholder="nama@email.com">
      </div>
      <div>
        <label class="text-xs text-slate-300">Password</label>
        <input id="auth-password" type="password" required class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm outline-none focus:border-red-500" placeholder="Minimal 6 karakter">
      </div>
      <button type="submit" class="w-full bg-red-600 hover:bg-red-500 py-3 rounded-xl font-bold text-white text-sm cursor-pointer">Proses Masuk</button>
    </form>
    <button onclick="toggleMode()" id="auth-switch" class="w-full mt-4 text-xs text-slate-400 text-center cursor-pointer">Belum punya akun? <b>Daftar</b></button>
  </div>
</section>

<!-- DASHBOARD SEDERHANA -->
<section id="app" class="page min-h-screen w-full flex-col p-6">
  <h1 class="text-2xl font-bold text-white">Berhasil Masuk!</h1>
  <p id="logged-email" class="text-sm text-slate-400 mt-2"></p>
  <button onclick="logout()" class="mt-5 bg-red-600 px-4 py-2 rounded-xl text-white font-bold w-32">Logout</button>
</section>

<script>
  // Pastikan Supabase dimuat dengan aman
  const SUPABASE_URL = "https://glpsvhnffonxbkp.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_Ccq1Re-OykljPEIJn3FI6g_oGNPHkWQ";
  
  let supabase = null;
  try {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (err) {
    alert("Gagal memuat modul Supabase: " + err.message);
  }

  let isLogin = true;

  function toggleMode() {
    isLogin = !isLogin;
    document.getElementById('auth-title').innerText = isLogin ? "Login" : "Daftar";
  }

  async function handleAuth(e) {
    e.preventDefault();
    const email = document.getElementById('auth-email').value.trim().toLowerCase();
    const password = document.getElementById('auth-password').value;

    if (!supabase) {
      alert("Klien Supabase belum siap!");
      return;
    }

    try {
      if (!isLogin) {
        alert("Mengirim data pendaftaran...");
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;
        alert("Pendaftaran Berhasil! Silakan klik tombol switch ke Login lalu masuk.");
        toggleMode();
      } else {
        alert("Menghubungkan ke server untuk login...");
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        
        alert("Login sukses! Membuka aplikasi...");
        document.getElementById('logged-email').innerText = "Email: " + data.user.email;
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('app').classList.add('active');
      }
    } catch (err) {
      // Menampilkan pesan error asli dari Supabase agar terlihat di HP
      alert("ERROR SUPABASE: " + (err.message || JSON.stringify(err)));
    }
  }

  async function logout() {
    await supabase.auth.signOut();
    location.reload();
  }
</script>
</body>
</html>
